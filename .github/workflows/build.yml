name: Build Flutter APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create Flutter Android project
        run: |
          flutter create \
            --platforms=android \
            --project-name=inspire_safety \
            --org=com.inspire.safety \
            build_app

      - name: Add Android permissions
        run: |
          python3 - <<'PY'
          from pathlib import Path

          manifest = Path(
              "build_app/android/app/src/main/AndroidManifest.xml"
          )

          content = manifest.read_text(encoding="utf-8")

          permissions = [
              '    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />',
              '    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />',
              '    <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />',
              '    <uses-permission android:name="android.permission.FOREGROUND_SERVICE_LOCATION" />',
          ]

          manifest_end = content.find('>', content.find('<manifest'))

          for permission in permissions:
              if permission not in content:
                  content = (
                      content[:manifest_end + 1]
                      + '\n'
                      + permission
                      + content[manifest_end + 1:]
                  )
                  manifest_end += len(permission) + 1

          manifest.write_text(content, encoding="utf-8")
          PY

      - name: Copy application files
        run: |
          cp pubspec.yaml build_app/pubspec.yaml
          rm -rf build_app/lib
          cp -r lib build_app/lib

      - name: Remove default Flutter test
        run: |
          rm -rf build_app/test

      - name: Get Flutter dependencies
        working-directory: build_app
        run: flutter pub get

      - name: Analyze Flutter project
        working-directory: build_app
        run: flutter analyze

      - name: Build release APK
        working-directory: build_app
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: inspire-safety-apk
          path: build_app/build/app/outputs/flutter-apk/app-release.apk
